<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient tailored for PSC-DATASCI -->
    <linearGradient id="bgGrad_PSC-DATASCI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829" />
      <stop offset="55%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Accent Badge Gradient -->
    <linearGradient id="accentGrad_PSC-DATASCI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glassmorphic Card Container -->
    <linearGradient id="cardGrad_PSC-DATASCI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow_PSC-DATASCI" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <pattern id="gridPattern_PSC-DATASCI" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad_PSC-DATASCI)" />
  <rect width="800" height="450" fill="url(#gridPattern_PSC-DATASCI)" />

  <!-- Thematic Ambient Light Orbs -->
  <circle cx="700" cy="110" r="220" fill="#c084fc" opacity="0.18" filter="blur(40px)" />
  <circle cx="100" cy="380" r="160" fill="#8b5cf6" opacity="0.14" filter="blur(40px)" />

  <!-- Official OUT Top Institutional Gold Bar -->
  <rect x="0" y="0" width="800" height="14" fill="#FFD200" />

  <!-- OUT Institutional Brand Pill -->
  <g transform="translate(48, 44)">
    <rect width="360" height="34" rx="17" fill="#003B66" fill-opacity="0.65" stroke="#FFD200" stroke-opacity="0.85" stroke-width="1.5" />
    <circle cx="18" cy="17" r="7" fill="#FFD200" />
    <text x="36" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">THE OPEN UNIVERSITY OF TANZANIA</text>
  </g>

  <!-- Faculty / Department Label -->
  <g transform="translate(48, 98)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#a855f7" letter-spacing="0.5">IEMT PROFESSIONAL SHORT COURSES</text>
  </g>

  <!-- Course Code Badge -->
  <g transform="translate(48, 124)">
    <rect width="130" height="36" rx="8" fill="url(#accentGrad_PSC-DATASCI)" filter="url(#shadow_PSC-DATASCI)" />
    <text x="65" y="24" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.8">PSC-DATASCI</text>
  </g>

  <!-- Delivery / Program Type Badge -->
  <g transform="translate(190, 124)">
    <rect width="210" height="36" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
    <text x="105" y="23" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Professional Short Course</text>
  </g>

  <!-- Course Title (Multline wrapped) -->
  <g transform="translate(48, 200)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Data Science &amp; Applied</tspan><tspan x="0" dy="34">Machine Learning with Python</tspan>
    </text>
  </g>

  <!-- Key Syllabus Bullets / Subtitle -->
  <g transform="translate(48, 355)">
    <rect width="440" height="48" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <text x="18" y="28" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">TensorFlow, Pandas, Supervised Models &amp; Feature Engineering</text>
  </g>

  <!-- Right Visual Feature Showcase Card -->
  <g transform="translate(520, 70)" filter="url(#shadow_PSC-DATASCI)">
    <!-- Glassmorphic Card Container -->
    <rect width="232" height="310" rx="20" fill="url(#cardGrad_PSC-DATASCI)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Topic Thematic Graphic -->
    <g transform="translate(-5, 20)">
      
      <!-- Neural Net Synapses &amp; Data Clusters -->
      <g stroke="#a855f7" stroke-width="1.8" opacity="0.75">
        <line x1="50" y1="70" x2="120" y2="50" />
        <line x1="50" y1="70" x2="120" y2="110" />
        <line x1="50" y1="150" x2="120" y2="110" />
        <line x1="50" y1="150" x2="120" y2="170" />
        <line x1="120" y1="50" x2="190" y2="90" />
        <line x1="120" y1="110" x2="190" y2="90" />
        <line x1="120" y1="110" x2="190" y2="150" />
        <line x1="120" y1="170" x2="190" y2="150" />
      </g>
      <!-- Layer 1 Nodes -->
      <circle cx="50" cy="70" r="11" fill="#4c1d95" stroke="#c084fc" stroke-width="3" />
      <circle cx="50" cy="150" r="11" fill="#4c1d95" stroke="#c084fc" stroke-width="3" />
      <!-- Layer 2 Nodes -->
      <circle cx="120" cy="50" r="13" fill="#7e22ce" stroke="#f3e8ff" stroke-width="2.5" />
      <circle cx="120" cy="110" r="15" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" />
      <circle cx="120" cy="170" r="13" fill="#7e22ce" stroke="#f3e8ff" stroke-width="2.5" />
      <!-- Layer 3 Output Node -->
      <circle cx="190" cy="90" r="13" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
      <circle cx="190" cy="150" r="13" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
      <!-- Python Data Scatter Line -->
      <path d="M60,195 Q120,165 180,185" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="3,3" />
      <text x="120" y="215" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="1">NEURAL NETWORKS &amp; ML</text>
    
    </g>

    <!-- Bottom Institutional Verified Stamp -->
    <g transform="translate(16, 260)">
      <rect width="200" height="34" rx="8" fill="#003B66" fill-opacity="0.9" stroke="#FFD200" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#22c55e" />
      <text x="34" y="21" font-family="'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">SARIS &amp; TCU ACCREDITED</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="442" width="800" height="8" fill="url(#accentGrad_PSC-DATASCI)" />
</svg>