      <stop offset="0%" stop-color="#041f1c" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="iconBorder_flaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
