  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#iconBg_flaw)" stroke="url(#iconBorder_flaw)" stroke-width="3" />
  
  <!-- Subtle Internal Glow -->
  <circle cx="64" cy="64" r="42" fill="#2dd4bf" opacity="0.15" />

  <!-- Vector Illustration -->
  
      <!-- Scales of Justice -->
