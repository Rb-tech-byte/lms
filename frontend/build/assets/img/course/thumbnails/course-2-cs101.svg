<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient tailored for CS101 -->
    <linearGradient id="bgGrad_CS101" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Accent Badge Gradient -->
    <linearGradient id="accentGrad_CS101" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glassmorphic Card Container -->
    <linearGradient id="cardGrad_CS101" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow_CS101" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <pattern id="gridPattern_CS101" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad_CS101)" />
  <rect width="800" height="450" fill="url(#gridPattern_CS101)" />

  <!-- Thematic Ambient Light Orbs -->
  <circle cx="700" cy="110" r="220" fill="#6ee7b7" opacity="0.18" filter="blur(40px)" />
  <circle cx="100" cy="380" r="160" fill="#10b981" opacity="0.14" filter="blur(40px)" />

  <!-- Official OUT Top Institutional Gold Bar -->
  <rect x="0" y="0" width="800" height="14" fill="#FFD200" />

  <!-- OUT Institutional Brand Pill -->
  <g transform="translate(48, 44)">
    <rect width="360" height="34" rx="17" fill="#003B66" fill-opacity="0.65" stroke="#FFD200" stroke-opacity="0.85" stroke-width="1.5" />
    <circle cx="18" cy="17" r="7" fill="#FFD200" />
    <text x="36" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">THE OPEN UNIVERSITY OF TANZANIA</text>
  </g>

  <!-- Faculty / Department Label -->
  <g transform="translate(48, 98)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="0.5">FACULTY OF SCIENCE, TECHNOLOGY &amp; ENVIRONMENT</text>
  </g>

  <!-- Course Code Badge -->
  <g transform="translate(48, 124)">
    <rect width="130" height="36" rx="8" fill="url(#accentGrad_CS101)" filter="url(#shadow_CS101)" />
    <text x="65" y="24" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#064e3b" letter-spacing="0.8">CS101</text>
  </g>

  <!-- Delivery / Program Type Badge -->
  <g transform="translate(190, 124)">
    <rect width="210" height="36" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
    <text x="105" y="23" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Faculty Undergraduate Degree</text>
  </g>

  <!-- Course Title (Multline wrapped) -->
  <g transform="translate(48, 200)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Data Structures &amp; Algorithms</tspan><tspan x="0" dy="34">in Python Programming</tspan>
    </text>
  </g>

  <!-- Key Syllabus Bullets / Subtitle -->
  <g transform="translate(48, 355)">
    <rect width="440" height="48" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <text x="18" y="28" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Binary Trees, Graphs, Sorting Algorithms, Big-O Complexity &amp; Recursion</text>
  </g>

  <!-- Right Visual Feature Showcase Card -->
  <g transform="translate(520, 70)" filter="url(#shadow_CS101)">
    <!-- Glassmorphic Card Container -->
    <rect width="232" height="310" rx="20" fill="url(#cardGrad_CS101)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Topic Thematic Graphic -->
    <g transform="translate(-5, 20)">
      
      <!-- Binary Tree Hierarchy &amp; Sorting Algorithm -->
      <!-- Root Node -->
      <circle cx="120" cy="55" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
      <text x="120" y="60" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">42</text>
      <!-- Branch Lines -->
      <line x1="110" y1="67" x2="80" y2="100" stroke="#34d399" stroke-width="2.5" />
      <line x1="130" y1="67" x2="160" y2="100" stroke="#34d399" stroke-width="2.5" />
      <!-- Left Child -->
      <circle cx="80" cy="110" r="13" fill="#047857" stroke="#34d399" stroke-width="2" />
      <text x="80" y="115" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">18</text>
      <!-- Right Child -->
      <circle cx="160" cy="110" r="13" fill="#047857" stroke="#34d399" stroke-width="2" />
      <text x="160" y="115" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">89</text>
      <!-- Sub-branches -->
      <line x1="72" y1="122" x2="55" y2="148" stroke="#34d399" stroke-width="2" />
      <line x1="88" y1="122" x2="105" y2="148" stroke="#34d399" stroke-width="2" />
      <circle cx="55" cy="155" r="10" fill="#065f46" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="55" y="159" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">7</text>
      <circle cx="105" cy="155" r="10" fill="#065f46" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="105" y="159" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">27</text>
      <text x="120" y="200" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1">PYTHON SEARCH TREES</text>
    
    </g>

    <!-- Bottom Institutional Verified Stamp -->
    <g transform="translate(16, 260)">
      <rect width="200" height="34" rx="8" fill="#003B66" fill-opacity="0.9" stroke="#FFD200" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#22c55e" />
      <text x="34" y="21" font-family="'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">SARIS &amp; TCU ACCREDITED</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="442" width="800" height="8" fill="url(#accentGrad_CS101)" />
</svg>