name: OUT LMS PR Auto-Labeler & Size Inspector

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Categorize PR by Subsystem & Size
    runs-on: ubuntu-latest
    steps:
      - name: Apply Subsystem Labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Calculate & Apply PR Size Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            let sizeLabel = 'size/XS';
            if (changes > 1000) sizeLabel = 'size/XL';
            else if (changes > 500) sizeLabel = 'size/L';
            else if (changes > 150) sizeLabel = 'size/M';
            else if (changes > 30) sizeLabel = 'size/S';

            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const currentLabels = pr.labels.map(l => l.name);

            // Remove any outdated size label
            for (const sl of sizeLabels) {
              if (sl !== sizeLabel && currentLabels.includes(sl)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: sl
                  });
                } catch (e) { /* ignore */ }
              }
            }

            // Add the calculated size label
            if (!currentLabels.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [sizeLabel]
              });
            }

            console.log(`Assigned size label: ${sizeLabel} (${changes} line changes)`);
