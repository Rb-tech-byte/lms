<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="catCoverBg_iemt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="55%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="catAccent_iemt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <pattern id="catGrid_iemt" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.05" />
    </pattern>
  </defs>

  <!-- Cover Background -->
  <rect width="800" height="450" fill="url(#catCoverBg_iemt)" />
  <rect width="800" height="450" fill="url(#catGrid_iemt)" />

  <!-- Top Institutional Bar -->
  <rect x="0" y="0" width="800" height="14" fill="#FFD200" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="110" r="220" fill="#818cf8" opacity="0.18" filter="blur(45px)" />
  <circle cx="100" cy="380" r="160" fill="#4f46e5" opacity="0.14" filter="blur(40px)" />

  <!-- Institutional Tag -->
  <g transform="translate(48, 44)">
    <rect width="360" height="32" rx="16" fill="#003B66" fill-opacity="0.65" stroke="#FFD200" stroke-opacity="0.85" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#FFD200" />
    <text x="32" y="21" font-family="'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1">THE OPEN UNIVERSITY OF TANZANIA</text>
  </g>

  <!-- Category Code Badge -->
  <g transform="translate(48, 96)">
    <rect width="130" height="34" rx="8" fill="url(#catAccent_iemt)" />
    <text x="65" y="23" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#ffffff">IEMT</text>
  </g>

  <!-- Title -->
  <g transform="translate(48, 175)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Institute of Educational &amp;</tspan><tspan x="0" dy="34">Management Technologies</tspan>
    </text>
  </g>

  <!-- Academic Disciplines / Focus Areas -->
  <g transform="translate(48, 330)">
    <rect width="480" height="44" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <text x="20" y="27" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">Programs: <tspan fill="#e2e8f0">Educational Technology • Instructional Systems • Digital Media</tspan></text>
  </g>

  <!-- Right Visual Emblem Card -->
  <g transform="translate(560, 90)">
    <rect width="190" height="260" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <g transform="translate(31, 35)">
      
      <!-- Campus Tech Hub &amp; Circuits -->
      <rect x="35" y="35" width="58" height="58" rx="12" fill="#3730a3" stroke="#818cf8" stroke-width="2.5" />
      <circle cx="64" cy="64" r="14" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />
      <path d="M 64,20 L 64,35 M 64,93 L 64,108 M 20,64 L 35,64 M 93,64 L 108,64" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="64" cy="20" r="3" fill="#facc15" />
      <circle cx="64" cy="108" r="3" fill="#facc15" />
      <circle cx="20" cy="64" r="3" fill="#facc15" />
      <circle cx="108" cy="64" r="3" fill="#facc15" />
    
    </g>
    <g transform="translate(15, 205)">
      <rect width="160" height="32" rx="8" fill="#003B66" stroke="#FFD200" stroke-width="1.5" />
      <text x="80" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACCREDITED FACULTY</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="440" width="800" height="10" fill="url(#catAccent_iemt)" />
</svg>