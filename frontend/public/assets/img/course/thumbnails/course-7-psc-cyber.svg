<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient tailored for PSC-CYBER -->
    <linearGradient id="bgGrad_PSC-CYBER" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0505" />
      <stop offset="55%" stop-color="#3b0a0a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Accent Badge Gradient -->
    <linearGradient id="accentGrad_PSC-CYBER" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Glassmorphic Card Container -->
    <linearGradient id="cardGrad_PSC-CYBER" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow_PSC-CYBER" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <pattern id="gridPattern_PSC-CYBER" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad_PSC-CYBER)" />
  <rect width="800" height="450" fill="url(#gridPattern_PSC-CYBER)" />

  <!-- Thematic Ambient Light Orbs -->
  <circle cx="700" cy="110" r="220" fill="#ef4444" opacity="0.18" filter="blur(40px)" />
  <circle cx="100" cy="380" r="160" fill="#dc2626" opacity="0.14" filter="blur(40px)" />

  <!-- Official OUT Top Institutional Gold Bar -->
  <rect x="0" y="0" width="800" height="14" fill="#FFD200" />

  <!-- OUT Institutional Brand Pill -->
  <g transform="translate(48, 44)">
    <rect width="360" height="34" rx="17" fill="#003B66" fill-opacity="0.65" stroke="#FFD200" stroke-opacity="0.85" stroke-width="1.5" />
    <circle cx="18" cy="17" r="7" fill="#FFD200" />
    <text x="36" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">THE OPEN UNIVERSITY OF TANZANIA</text>
  </g>

  <!-- Faculty / Department Label -->
  <g transform="translate(48, 98)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="0.5">IEMT PROFESSIONAL SHORT COURSES</text>
  </g>

  <!-- Course Code Badge -->
  <g transform="translate(48, 124)">
    <rect width="130" height="36" rx="8" fill="url(#accentGrad_PSC-CYBER)" filter="url(#shadow_PSC-CYBER)" />
    <text x="65" y="24" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.8">PSC-CYBER</text>
  </g>

  <!-- Delivery / Program Type Badge -->
  <g transform="translate(190, 124)">
    <rect width="210" height="36" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
    <text x="105" y="23" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Professional Short Course</text>
  </g>

  <!-- Course Title (Multline wrapped) -->
  <g transform="translate(48, 200)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Cybersecurity & Network</tspan><tspan x="0" dy="34">Defense Fundamentals</tspan>
    </text>
  </g>

  <!-- Key Syllabus Bullets / Subtitle -->
  <g transform="translate(48, 355)">
    <rect width="440" height="48" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <text x="18" y="28" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Zero-Trust Architecture, Network Firewalls, Cryptography & SIEM</text>
  </g>

  <!-- Right Visual Feature Showcase Card -->
  <g transform="translate(520, 70)" filter="url(#shadow_PSC-CYBER)">
    <!-- Glassmorphic Card Container -->
    <rect width="232" height="310" rx="20" fill="url(#cardGrad_PSC-CYBER)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Topic Thematic Graphic -->
    <g transform="translate(-5, 20)">
      
      <!-- Cyber Defense Shield & Zero-Trust Padlock -->
      <path d="M120,30 L195,65 C195,140 160,190 120,215 C80,190 45,140 45,65 Z"
            fill="#dc2626" fill-opacity="0.22" stroke="#ef4444" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M120,55 L175,82 C175,135 150,172 120,192 C90,172 65,135 65,82 Z"
            fill="none" stroke="#fca5a5" stroke-width="1.8" stroke-dasharray="4,3" />
      <!-- Padlock in center -->
      <rect x="100" y="115" width="40" height="32" rx="5" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5" />
      <path d="M107,115 L107,100 C107,92 113,87 120,87 C127,87 133,92 133,100 L133,115"
            fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="120" cy="128" r="4" fill="#ffffff" />
      <line x1="120" y1="132" x2="120" y2="140" stroke="#ffffff" stroke-width="2.5" />
      <!-- Digital Security Matrix nodes -->
      <circle cx="75" cy="155" r="3" fill="#38bdf8" />
      <circle cx="165" cy="155" r="3" fill="#38bdf8" />
      <line x1="75" y1="155" x2="100" y2="135" stroke="rgba(56,189,248,0.5)" stroke-width="1" />
      <line x1="165" y1="155" x2="140" y2="135" stroke="rgba(56,189,248,0.5)" stroke-width="1" />
      <text x="120" y="215" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1">ZERO-TRUST SECURITY</text>
    
    </g>

    <!-- Bottom Institutional Verified Stamp -->
    <g transform="translate(16, 260)">
      <rect width="200" height="34" rx="8" fill="#003B66" fill-opacity="0.9" stroke="#FFD200" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#22c55e" />
      <text x="34" y="21" font-family="'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">SARIS &amp; TCU ACCREDITED</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="442" width="800" height="8" fill="url(#accentGrad_PSC-CYBER)" />
</svg>