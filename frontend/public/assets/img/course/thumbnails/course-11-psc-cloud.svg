<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient tailored for PSC-CLOUD -->
    <linearGradient id="bgGrad_PSC-CLOUD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a36" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Accent Badge Gradient -->
    <linearGradient id="accentGrad_PSC-CLOUD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glassmorphic Card Container -->
    <linearGradient id="cardGrad_PSC-CLOUD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow_PSC-CLOUD" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <pattern id="gridPattern_PSC-CLOUD" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad_PSC-CLOUD)" />
  <rect width="800" height="450" fill="url(#gridPattern_PSC-CLOUD)" />

  <!-- Thematic Ambient Light Orbs -->
  <circle cx="700" cy="110" r="220" fill="#38bdf8" opacity="0.18" filter="blur(40px)" />
  <circle cx="100" cy="380" r="160" fill="#2563eb" opacity="0.14" filter="blur(40px)" />

  <!-- Official OUT Top Institutional Gold Bar -->
  <rect x="0" y="0" width="800" height="14" fill="#FFD200" />

  <!-- OUT Institutional Brand Pill -->
  <g transform="translate(48, 44)">
    <rect width="360" height="34" rx="17" fill="#003B66" fill-opacity="0.65" stroke="#FFD200" stroke-opacity="0.85" stroke-width="1.5" />
    <circle cx="18" cy="17" r="7" fill="#FFD200" />
    <text x="36" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">THE OPEN UNIVERSITY OF TANZANIA</text>
  </g>

  <!-- Faculty / Department Label -->
  <g transform="translate(48, 98)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="0.5">IEMT PROFESSIONAL SHORT COURSES</text>
  </g>

  <!-- Course Code Badge -->
  <g transform="translate(48, 124)">
    <rect width="130" height="36" rx="8" fill="url(#accentGrad_PSC-CLOUD)" filter="url(#shadow_PSC-CLOUD)" />
    <text x="65" y="24" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#172554" letter-spacing="0.8">PSC-CLOUD</text>
  </g>

  <!-- Delivery / Program Type Badge -->
  <g transform="translate(190, 124)">
    <rect width="210" height="36" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
    <text x="105" y="23" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Professional Short Course</text>
  </g>

  <!-- Course Title (Multline wrapped) -->
  <g transform="translate(48, 200)">
    <text font-family="'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Cloud Infrastructure &amp; Systems</tspan><tspan x="0" dy="34">Administration with Docker</tspan>
    </text>
  </g>

  <!-- Key Syllabus Bullets / Subtitle -->
  <g transform="translate(48, 355)">
    <rect width="440" height="48" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
    <text x="18" y="28" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Linux Servers, Container Orchestration, Nginx &amp; Disaster Recovery</text>
  </g>

  <!-- Right Visual Feature Showcase Card -->
  <g transform="translate(520, 70)" filter="url(#shadow_PSC-CLOUD)">
    <!-- Glassmorphic Card Container -->
    <rect width="232" height="310" rx="20" fill="url(#cardGrad_PSC-CLOUD)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Topic Thematic Graphic -->
    <g transform="translate(-5, 20)">
      
      <!-- Server Rack &amp; Cloud Mesh -->
      <rect x="65" y="45" width="110" height="135" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="2.5" />
      <!-- Server Blade 1 -->
      <rect x="75" y="55" width="90" height="24" rx="3" fill="#1e40af" stroke="#93c5fd" stroke-width="1" />
      <circle cx="86" cy="67" r="3" fill="#22c55e" />
      <circle cx="96" cy="67" r="3" fill="#22c55e" />
      <line x1="110" y1="67" x2="155" y2="67" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
      <!-- Server Blade 2 -->
      <rect x="75" y="87" width="90" height="24" rx="3" fill="#1e40af" stroke="#93c5fd" stroke-width="1" />
      <circle cx="86" cy="99" r="3" fill="#22c55e" />
      <circle cx="96" cy="99" r="3" fill="#38bdf8" />
      <line x1="110" y1="99" x2="155" y2="99" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
      <!-- Server Blade 3 -->
      <rect x="75" y="119" width="90" height="24" rx="3" fill="#1e40af" stroke="#93c5fd" stroke-width="1" />
      <circle cx="86" cy="131" r="3" fill="#22c55e" />
      <circle cx="96" cy="131" r="3" fill="#22c55e" />
      <line x1="110" y1="131" x2="155" y2="131" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
      <!-- Cloud Container Cubes -->
      <text x="120" y="205" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe" letter-spacing="1">DOCKER &amp; HYBRID CLOUD</text>
    
    </g>

    <!-- Bottom Institutional Verified Stamp -->
    <g transform="translate(16, 260)">
      <rect width="200" height="34" rx="8" fill="#003B66" fill-opacity="0.9" stroke="#FFD200" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#22c55e" />
      <text x="34" y="21" font-family="'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">SARIS &amp; TCU ACCREDITED</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="442" width="800" height="8" fill="url(#accentGrad_PSC-CLOUD)" />
</svg>