      <line x1="42" y1="46" x2="35" y2="65" stroke="#facc15" stroke-width="1.5" />
      <line x1="42" y1="46" x2="49" y2="65" stroke="#facc15" stroke-width="1.5" />
      <path d="M30,65 Q42,76 54,65 Z" fill="#2dd4bf" />
      <!-- Right Pan -->
      <line x1="86" y1="46" x2="79" y2="65" stroke="#facc15" stroke-width="1.5" />
