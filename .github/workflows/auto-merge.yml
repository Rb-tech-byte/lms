name: OUT LMS Auto-Merge Bot

on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["OUT LMS Continuous Integration"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  # ------------------------------------------------------------
  # Dependabot Auto-Approve & Auto-Merge
  # ------------------------------------------------------------
  dependabot-merge:
    name: Dependabot Auto-Approve & Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Approve Dependabot PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Approving Dependabot PR #${pr.number}...`);
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              body: `🤖 **Auto-Merge Bot**: Dependabot dependency update automatically verified and approved for secure inclusion.`,
              event: 'APPROVE'
            });

      - name: Enable Auto-Merge for Dependabot PR
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------
  # General PR Auto-Merge (with 'auto-merge' label or approved review)
  # ------------------------------------------------------------
  general-auto-merge:
    name: Evaluate & Merge Eligible PRs
    runs-on: ubuntu-latest
    steps:
      - name: Process PR Merge Eligibility
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Determine target PR number based on event trigger
            let prNumber = null;
            if (context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
            } else if (context.payload.workflow_run && context.payload.workflow_run.pull_requests.length > 0) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            }

            if (!prNumber) {
              console.log('No specific PR associated with this trigger.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (pr.state !== 'open' || pr.draft) {
              console.log(`PR #${prNumber} is not open or is draft. Skipping.`);
              return;
            }

            const labels = pr.labels.map(l => l.name);
            const isDependabot = pr.user && pr.user.login === 'dependabot[bot]';
            const hasAutoMergeLabel = labels.includes('auto-merge') || labels.includes('dependencies');

            // Fetch reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: prNumber
            });

            const hasApproval = isDependabot || reviews.some(r => r.state === 'APPROVED');

            if (!hasApproval && !hasAutoMergeLabel) {
              console.log(`PR #${prNumber} does not have required approval or 'auto-merge' label.`);
              return;
            }

            // Check mergeable status
            if (pr.mergeable === false) {
              console.log(`PR #${prNumber} has merge conflicts. Cannot auto-merge.`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `⚠️ **Auto-Merge Bot**: Merge conflicts detected. Please rebase against latest \`main\` branch.`
              });
              return;
            }

            try {
              console.log(`Executing auto-merge for PR #${prNumber}...`);
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'merge',
                commit_title: `${pr.title} (#${prNumber})`,
                commit_message: `Auto-merged by OUT LMS Bot after all quality criteria and reviews passed.`
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `🚀 **Auto-Merge Bot**: Successfully merged PR #${prNumber} into \`main\` branch.`
              });
            } catch (err) {
              console.log(`Merge deferred or blocked: ${err.message}`);
            }
